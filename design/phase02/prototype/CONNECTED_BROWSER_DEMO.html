<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEVFOLIO OS — Phase 02.13 Design Prototype</title>
<style>
:root{--bg:#10151D;--card:#17212D;--raised:#213042;--text:#F1F5F9;--muted:#B0BECC;--teal:#70D9C3;--blue:#9CC0FF;--border:#344454;--focus:#70D9C3;--danger:#FDA4AF}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,'Segoe UI',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.skip{position:absolute;left:8px;top:-90px;z-index:100;background:var(--teal);color:var(--bg);padding:10px}.skip:focus{top:8px}.notice{background:#243342;border-bottom:1px solid #506579;text-align:center;padding:8px 20px;font-size:12px;color:#D5E7F0}.notice strong{color:var(--teal)}.pubhead{height:78px;border-bottom:1px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100vw - 1244px)/2));gap:18px}.brand{color:var(--text);font-weight:800;letter-spacing:-.03em}.pubnav{display:flex;align-items:center;gap:27px}.pubnav a{font-size:14px;color:var(--muted);font-weight:600}.pubnav a[aria-current="page"]{color:var(--teal)}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;min-height:46px;border:1px solid var(--border);background:var(--raised);color:var(--text);border-radius:10px;font-weight:700;font-size:14px;text-decoration:none}.btn:hover{text-decoration:none;background:#2A4250}.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--bg)}.btn.primary:hover{background:#8AE8D2}.btn.warn{border-color:#9E6474;color:#FFB3C4;background:#3A2730}.btn.sm{min-height:40px;padding:8px 12px}.menu{display:none}.wrap{max-width:1244px;width:calc(100% - 40px);margin:0 auto}.hero{padding:80px 0 85px}.eyebrow{font-size:11px;font-weight:800;color:var(--teal);letter-spacing:.17em;text-transform:uppercase}.hero h1,.pagehead h1{font-size:clamp(2.65rem,5vw,4.9rem);line-height:1.06;max-width:940px;letter-spacing:-.05em;margin:22px 0}.hero p,.pagehead p{color:var(--muted);font-size:18px;max-width:740px;line-height:1.75}.pagehead{padding:63px 0 74px}.pagehead h1{font-size:clamp(2.35rem,4.3vw,4.1rem)}.actions{display:flex;flex-wrap:wrap;gap:13px;margin-top:30px}.section{padding:58px 0;border-top:1px solid var(--border)}.section h2{font-size:clamp(1.85rem,3vw,2.7rem);line-height:1.13;letter-spacing:-.03em;margin:12px 0}.section p{color:var(--muted);margin:0 0 22px}.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.cols.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:25px;min-width:0}.card h3{font-size:23px;line-height:1.25;letter-spacing:-.02em;margin:14px 0}.card p{font-size:14px;color:var(--muted)}.card.linked{display:block;text-decoration:none;color:var(--text)}.card.linked:hover{border-color:#659AA1}.chip{display:inline-flex;border-radius:99px;background:#173C40;color:var(--teal);font-size:11px;font-weight:700;padding:4px 11px;margin:0 5px 6px 0}.chip.warn{background:#463B25;color:#FCD34D}.chip.muted{background:#28384A;color:#CEDAEA}.art{margin:20px 0 30px;min-height:250px;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 70% 17%,#244D55,transparent 48%),linear-gradient(120deg,#172735,#1D3840);border:1px solid #476D77;border-radius:16px}.art .symbols{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:670px;width:80%}.art span{border:1px solid #5B9296;border-radius:8px;background:#14343C;padding:22px 8px;text-align:center;color:#D1F1EE;font-size:12px;font-weight:700;font-family:ui-monospace,monospace}.footer{border-top:1px solid var(--border);padding:48px 0 55px;color:var(--muted);font-size:13px}.footer .wrap{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.prose{color:#C9D6E2;max-width:76ch;line-height:1.88}.prose h2{color:var(--text);font-size:26px}.form{display:grid;gap:17px;max-width:750px}.field{display:grid;gap:6px}.field label{font-size:13px;font-weight:700}.field input,.field textarea,.field select{border-radius:10px;border:1px solid #788BA2;background:var(--raised);color:var(--text);min-height:46px;padding:12px 14px;width:100%}.field textarea{min-height:140px}.small{color:#9DB0BF;font-size:12px}.feedback{padding:14px;border:1px solid #588073;border-radius:10px;background:#1E3C34;color:#C3FFE7;margin-top:18px}.feedback.error{border-color:#996276;background:#402D37;color:#FFD9E4}.feedback.warn{border-color:#9E8945;background:#443D28;color:#FFF0C2}.admin{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100vh - 34px)}.side{padding:25px 18px;background:var(--card);border-right:1px solid var(--border)}.side strong{font-size:20px}.side .cat{font:700 10px ui-monospace,monospace;color:#8CA4B8;letter-spacing:.12em;display:block;margin:28px 9px 8px}.side a{display:block;color:#CAD7E0;font-size:13px;border-radius:9px;padding:8px 11px}.side a[aria-current="page"]{background:#24423F;color:var(--teal)}.adminbody{min-width:0}.top{height:76px;border-bottom:1px solid var(--border);padding:0 36px;display:flex;align-items:center;justify-content:space-between;gap:15px;color:var(--muted);font-size:13px}.content{max-width:1280px;margin:auto;padding:45px 38px 90px}.content h1{font-size:clamp(2rem,3.3vw,3.3rem);letter-spacing:-.04em;line-height:1.14;margin:12px 0}.content>p{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:35px 0}.stats .card b{font-size:35px;display:block;margin:14px 0}.tablebox{overflow-x:auto;border-radius:14px;border:1px solid var(--border);margin-top:27px}.tablebox table{width:100%;min-width:630px;border-collapse:collapse}.tablebox th,.tablebox td{text-align:left;padding:16px;border-bottom:1px solid var(--border);font-size:13px}.tablebox th{background:#233341;font-size:11px;letter-spacing:.04em;color:#B5C8D7}.tablebox tr:last-child td{border:0}.editor{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:22px;margin-top:28px}.editor .card{padding:27px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}.fields>.wide{grid-column:1/-1}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}.empty{border:1px dashed #63788C;border-radius:13px;background:#172632;text-align:center;padding:48px;margin:20px 0}.empty p{color:var(--muted)}.overlay{position:fixed;inset:0;background:#02070DCB;z-index:50;display:flex;align-items:center;justify-content:center;padding:18px}.modal{background:#1E2D3A;border:1px solid #53717E;border-radius:17px;padding:27px;width:min(500px,100%);box-shadow:0 30px 75px #0008}.modal h2{font-size:25px}.modal p{color:var(--muted)}.toast{position:fixed;bottom:22px;right:22px;background:#25493F;border:1px solid #538A75;color:#D7FFE8;padding:13px 18px;z-index:90;border-radius:10px;max-width:calc(100% - 44px);font-size:13px}.drawer{position:fixed;inset:34px 0 0;background:#050B12BB;z-index:40}.drawerbox{background:#1C2C38;width:min(85vw,320px);height:100%;padding:24px;overflow:auto}.drawer a{display:block;padding:13px 7px;border-bottom:1px solid var(--border)}.hidden{display:none}
@media(max-width:940px){.admin{grid-template-columns:1fr}.side{display:none}.top{padding:0 20px}.content{padding:36px 20px 80px}.menu{display:inline-flex}.editor{grid-template-columns:1fr}}
@media(max-width:650px){.pubhead{height:70px;padding:0 20px}.pubnav{display:none}.menu{display:inline-flex}.hero{padding:55px 0 68px}.hero h1{font-size:clamp(2.28rem,10vw,3.4rem)}.hero p,.pagehead p{font-size:15px}.pagehead{padding:43px 0 56px}.pagehead h1{font-size:clamp(2.1rem,9vw,2.9rem)}.section{padding:42px 0}.cols,.cols.three,.fields,.stats{grid-template-columns:1fr}.actions,.toolbar{flex-direction:column}.actions .btn,.toolbar .btn{width:100%}.art{min-height:195px}.art .symbols{gap:6px;width:94%}.art span{font-size:10px;padding:14px 2px}.content{padding:30px 18px 74px}.content h1{font-size:2.15rem}.editor .card{padding:19px}.footer .wrap{display:block}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body><a class="skip" href="#main">Skip to main content</a><div class="notice"><strong>OFFLINE DESIGN PROTOTYPE</strong> — Sample content; no authentication, persistence, upload, email delivery or publishing</div><div id="app"></div><div id="modal"></div><div id="drawer"></div><div id="toasts" aria-live="polite"></div>
<script>
const paths={'/':'Homepage','/projects':'Projects','/projects/sample-project':'Case Study','/research':'Research','/research/sample-study':'Study Detail','/about':'About','/contact':'Contact','/admin/login':'Admin Login','/admin/verify':'Email Challenge','/admin':'Dashboard','/admin/projects':'Project Manager','/admin/projects/new':'Project Editor','/admin/preview':'Private Preview','/admin/media':'Media','/admin/settings':'Settings','/admin/messages':'Messages'};
let filter=false,lastFocus=null;
const a=(p,s,c='')=>`<a class="${c}" href="#${p}">${s}</a>`;
const button=(s,action,c='')=>`<button type="button" class="btn ${c}" data-action="${action}">${s}</button>`;
const chip=(s,c='')=>`<span class="chip ${c}">${s}</span>`;
const art=`<div class="art" role="img" aria-label="Abstract software architecture illustration"><div class="symbols"><span>INPUTS</span><span>DECISIONS</span><span>EVIDENCE</span></div></div>`;
const card=(name,label,desc,dest)=>`<a href="#${dest}" class="card linked">${chip(label)}<h3>${name}</h3><p>${desc}</p><span style="color:var(--teal);font-weight:700;font-size:14px">Explore details ↗</span></a>`;
const intro=(tag,title,desc)=>`<div class="pagehead"><div class="eyebrow">${tag}</div><h1>${title}</h1><p>${desc}</p></div>`;
const section=(tag,title,desc,body)=>`<section class="section"><div class="eyebrow">${tag}</div><h2>${title}</h2><p>${desc}</p>${body||''}</section>`;
const pnav=r=>`<header class="pubhead">${a('/','[PUBLIC BRAND]','brand')}<nav class="pubnav" aria-label="Main navigation">${[['/projects','Work'],['/research','Research'],['/about','About']].map(([p,s])=>`<a href="#${p}" ${p===r?'aria-current="page"':''}>${s}</a>`).join('')}${a('/contact','Contact ↗','btn primary sm')}</nav>${button('☰ Menu','menu','menu sm')}</header>`;
const pfoot=`<footer class="footer"><div class="wrap"><div><b>[PUBLIC BRAND]</b> <span class="small">· Demonstration only</span></div><div>${a('/projects','Work')} &nbsp; ${a('/research','Research')} &nbsp; ${a('/about','About')} &nbsp; ${a('/contact','Contact')}</div></div></footer>`;
const pub={
'/':()=>`<section class="hero"><div class="eyebrow">Software developer / AI-ML researcher</div><h1>Build with clarity.<br>Research with rigor.</h1><p>[Replace with your truthful professional introduction.] Every featured item should demonstrate an engineering decision or verifiable research evidence.</p><div class="actions">${a('/projects','Explore work ↗','btn primary')}${a('/research','Explore research ↗','btn')}</div></section>${art}${section('01 / Engineering','Selected work','Only genuinely published records will appear on the live site.',`<div class="cols">${card('[Verified project title]','ENGINEERING','Role, architecture and technical tradeoffs.','/projects/sample-project')}${card('[Verified study title]','RESEARCH','Methods, actual stage and clear limitations.','/research/sample-study')}</div>`)}${section('02 / Background','Skills with evidence','Links to actual work—no invented proficiency percentages.',`<div class="cols three"><div class="card"><h3>Software</h3><p>Only technologies genuinely used.</p></div><div class="card"><h3>Research</h3><p>Verified studies, methods and findings.</p></div><div class="card"><h3>Systems</h3><p>Architecture, quality and reliability.</p></div></div>`)}${section('03 / About','A thoughtful engineering approach','Your accurate career story goes here.',a('/about','Read About ↗','btn'))}${section('04 / Connect','Start a conversation','Reach out about engineering or research.',a('/contact','Contact ↗','btn primary'))}`,
'/projects':()=>intro('WORK / INDEX','Engineering case studies.','Technical projects with real responsibilities, decisions and outcomes.')+`<section class="section"><div class="actions" style="margin:0 0 27px">${button('All projects','all',filter?'':'primary')}${button('Full-stack category','filter',filter?'primary':'')}</div><div class="cols">${card('[Published project]','FULL STACK','Actual role, product problem and architecture.','/projects/sample-project')}${filter?'':card('[Another published project]','ENGINEERING','Visible only if truly published.','/projects/sample-project')}</div></section>`,
'/projects/sample-project':()=>intro('WORK / DETAIL','[Actual project title]','One technical case study: the challenge, your role, architecture, trade-offs and confirmed results.')+art+section('01 / Challenge','Problem and ownership','[Describe the real engineering problem and your contribution.]','')+section('02 / Decisions','Architecture and tradeoffs','[Document actual service, data and reliability choices.]','')+section('03 / Evidence','Results and limitations','[Include only measurable, genuine outcomes.]',a('/projects','← Back to work','btn')),
'/research':()=>intro('RESEARCH / INDEX','Questions, experiments, evidence.','Ongoing studies and genuine publication records have clearly different labels.')+`<div class="cols">${card('[Research experiment]','ONGOING STUDY','Hypotheses, methods, datasets and expected limitations.','/research/sample-study')}${card('[Completed study]','COMPLETED','Completion is not the same as peer-reviewed publication.','/research/sample-study')}</div>`,
'/research/sample-study':()=>intro('RESEARCH / STUDY','[Research question]','Scientific stage: ongoing. CMS publication status is managed independently.')+chip('SCIENTIFIC STATUS: ONGOING','warn')+section('01 / Method','Research design','[Datasets, baselines, methodology and validation.]',art)+section('02 / Evidence','Results and limitations','[Real outputs only, no invented metrics.]',a('/research','← Back to Research','btn')),
'/about':()=>intro('ABOUT','The engineer behind the work.','[Owner-approved biography, educational background and research interests.]')+section('PROFILE','Engineering principles','Truthful approach, actual history, real interests.',`<div class="cols">${card('Professional experience','CAREER','Use the approved CMS experience records.','/contact')}${card('Research and learning','ACADEMIC','Use real academic and research records.','/research')}</div>`),
'/contact':()=>intro('CONTACT','Start a thoughtful conversation.','This offline form can demonstrate validation, but will not send or retain data.')+`<section class="section"><form id="contact-form" class="form"><div class="field"><label for="name">Your name</label><input id="name" required autocomplete="name" placeholder="Name"></div><div class="field"><label for="email">Email</label><input id="email" required type="email" autocomplete="email" placeholder="example@example.com"></div><div class="field"><label for="msg">Message</label><textarea id="msg" required placeholder="Use example text only"></textarea></div><div id="contact-status" aria-live="polite"></div><button class="btn primary" type="submit">Simulate sending ↗</button></form></section>`};
function side(r){const groups=[['OVERVIEW',[['/admin','Dashboard']]],['CONTENT',[['/admin/projects','Projects'],['/admin/projects/new','Editor']]],['ASSETS',[['/admin/media','Media']]],['COMMUNICATION',[['/admin/messages','Messages']]],['CONFIGURATION',[['/admin/settings','Settings']]]];return `<aside class="side"><strong>DEVFOLIO OS</strong>${groups.map(([n,items])=>`<span class="cat">${n}</span>${items.map(([p,s])=>`<a href="#${p}" ${r===p?'aria-current="page"':''}>${s}</a>`).join('')}`).join('')}<span class="cat">ACCOUNT</span>${a('/admin/login','Sign out (simulation)')}</aside>`}
function shell(r,body){return `<div class="admin">${side(r)}<div><div class="top"><span>${button('☰ Menu','menu','menu sm')} Workspace / ${paths[r]}</span>${chip('DESIGN ONLY','warn')}</div><main id="main" class="content">${body}</main></div></div>`}
const ah=(k,h,d)=>`<span class="eyebrow">${k}</span><h1>${h}</h1><p>${d}</p>`;
const field=(id,label,ph,wide=false)=>`<div class="field ${wide?'wide':''}"><label for="${id}">${label}</label>${wide?`<textarea id="${id}" placeholder="${ph}"></textarea>`:`<input id="${id}" placeholder="${ph}" ${id==='ptitle'||id==='slug'?'required':''}>`}</div>`;
const admin={
'/admin/login':()=>`<main class="wrap" id="main" style="max-width:580px;padding:68px 0 100px">${intro('OWNER ACCESS','Secure sign-in.','Offline illustration. Any example email/password advances; nothing is verified.')}<form id="login-form" class="form"><div class="field"><label for="authmail">Email</label><input id="authmail" autocomplete="username" required type="email" placeholder="owner@example.com"></div><div class="field"><label for="pass">Password</label><input id="pass" autocomplete="current-password" type="password" required placeholder="Example only"></div><button class="btn primary" type="submit">Continue →</button></form></main>`,
'/admin/verify':()=>`<main class="wrap" id="main" style="max-width:580px;padding:68px 0 100px">${intro('EMAIL CHALLENGE','Check your email.','No actual code is sent. Paste any sample characters to continue this flow.')}<form id="otp-form" class="form"><div class="field"><label for="otp">One-time code</label><input id="otp" autocomplete="one-time-code" inputmode="numeric" required placeholder="Paste sample code"></div><button class="btn primary" type="submit">Verify simulation →</button></form></main>`,
'/admin':()=>shell('/admin',ah('OVERVIEW','Content workspace.','Counts and changes must be loaded from authenticated records; these are not real.')+`<div class="stats">${['Published records','Private drafts','Unread inquiries'].map(x=>`<div class="card"><div class="small">${x}</div><b>—</b><div class="small">No database connected</div></div>`).join('')}</div>${section('START HERE','Manage published content','The full admin index and editor flow are linked below.',`<div class="cols">${card('Project manager','CMS','Review sample rows and start editing.','/admin/projects')}${card('Media library','MEDIA','Demonstrate upload error states.','/admin/media')}</div>`)}`),
'/admin/projects':()=>shell('/admin/projects',ah('CONTENT','Project manager.','These rows are placeholders, never real records.')+`<div class="actions">${a('/admin/projects/new','New project ↗','btn primary')}${button('Show empty state','empty')}</div><div id="rows" class="tablebox"><table><thead><tr><th>Title</th><th>Status</th><th>Last changed</th><th>Action</th></tr></thead><tbody>${[['[Draft project]','DRAFT'],['[Published project]','PUBLISHED']].map(([n,s])=>`<tr><td>${n}</td><td>${chip(s,s==='DRAFT'?'warn':'')}</td><td>[Sample timestamp]</td><td>${a('/admin/projects/new','Edit ↗')}</td></tr>`).join('')}</tbody></table></div>`),
'/admin/projects/new':()=>shell('/admin/projects/new',ah('CONTENT / EDIT','Project editor.','Simulate a draft save, preview and a publish validation dialog.')+`<div class="editor"><div class="card"><div class="eyebrow">DRAFT / PRIVATE</div><h3>Project details</h3><form id="edit-form"><div class="fields">${field('ptitle','Title','[Real project title]')}${field('slug','Slug','example-project')}${field('summary','Summary','Problem, role, outcome',true)}${field('architecture','Architecture & decisions','Actual design choices, constraints and lessons',true)}</div><div id="editor-status" aria-live="polite"></div><div class="toolbar">${button('Save Draft','save','primary')}${a('/admin/preview','Private Preview ↗','btn')}${button('Publish…','publish')}</div></form></div><aside class="card"><h3>Publication checks</h3><p class="small">Title + slug are illustrative required fields for this mock. The approved SRS and server determine real validation.</p>${chip('SERVER CONFIRMATION','warn')}<p class="small">No backend is connected. No actual data is stored.</p></aside></div>`),
'/admin/preview':()=>shell('/admin/preview',ah('PRIVATE PREVIEW','Review before publishing.','Real previews must be authenticated and excluded from indexing and caches.')+`<div class="feedback warn">PRIVATE DRAFT • Simulated preview only</div>${art}<div class="actions">${a('/admin/projects/new','← Return to editor','btn')}${button('Publish…','publish','primary')}</div>`),
'/admin/media':()=>shell('/admin/media',ah('ASSETS','Media library.','Real uploads require type/signature/size checks, ownership, and safe references.')+`<div class="card" style="max-width:700px"><div class="field"><label for="upload">Choose file (simulation)</label><input id="upload" type="file" accept="image/*,.pdf"><small class="small">No file is transmitted or stored.</small></div><div id="upload-status" aria-live="polite"></div><div class="toolbar">${button('Simulate rejected upload','reject','warn')}</div></div>`),
'/admin/messages':()=>shell('/admin/messages',ah('COMMUNICATION','Private inbox.','Only authenticated owner access should view actual visitor messages.')+`<div class="empty"><h3>No connected messages</h3><p>Sample empty inbox. Never put visitor PII in public design previews.</p></div>`),
'/admin/settings':()=>shell('/admin/settings',ah('CONFIGURATION','Website settings.','The public brand/font are open and the light-theme toggle is future-only.')+`<div class="card" style="max-width:820px"><div class="fields">${field('sitebrand','Public brand','[FINAL BRAND OPEN]')}${field('seo','SEO title','[Real page title]')}<div class="field wide"><label for="navitems">Whitelisted navigation routes</label><input readonly id="navitems" value="Work / Research / About / Contact"></div></div><div class="toolbar">${button('Simulate save','settings','primary')}</div></div>`)};
const current=()=>decodeURIComponent((location.hash||'#/').slice(1).split('?')[0])||'/';
function render(){let p=current(),isA=p.startsWith('/admin');document.getElementById('app').innerHTML=isA?(admin[p]||missing)():(pnav(p)+`<main id="main" class="wrap">${(pub[p]||missing)()}</main>`+pfoot);document.getElementById('modal').innerHTML='';document.getElementById('drawer').innerHTML='';window.scrollTo(0,0)}
function missing(){return intro('404','Unavailable page.','A real router must return HTTP 404 for missing or unpublished content.')+a('/','Home','btn primary')}
function feedback(id,message,error=false){let el=document.getElementById(id);if(el)el.innerHTML=`<div role="${error?'alert':'status'}" class="feedback ${error?'error':''}">${message}</div>`}
function showToast(text){const n=document.getElementById('toasts');n.innerHTML=`<div class="toast" role="status">${text}</div>`;setTimeout(()=>{n.innerHTML=''},4000)}
function modal(){lastFocus=document.activeElement;document.getElementById('modal').innerHTML=`<div class="overlay" data-overlay="true"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="eyebrow">SIMULATED SERVER ACTION</div><h2 id="mt">Publish this project?</h2><p>Actual publishing requires authorization, validation and a database transaction. This button only demonstrates confirmation feedback.</p><div class="actions">${button('Cancel','cancel')}${button('Confirm (simulation)','confirm','primary')}</div></div></div>`;document.querySelector('[data-action="cancel"]').focus()}
function closeModal(){document.getElementById('modal').innerHTML='';if(lastFocus&&lastFocus.isConnected)lastFocus.focus()}
function drawer(){lastFocus=document.activeElement;let links=current().startsWith('/admin')?[['/admin','Dashboard'],['/admin/projects','Projects'],['/admin/projects/new','Editor'],['/admin/media','Media'],['/admin/messages','Messages'],['/admin/settings','Settings'],['/admin/login','Sign out']]:[['/','Home'],['/projects','Work'],['/research','Research'],['/about','About'],['/contact','Contact']];document.getElementById('drawer').innerHTML=`<div class="drawer" data-drawer="true"><div class="drawerbox" role="dialog" aria-label="Navigation" aria-modal="true">${button('Close ✕','closedrawer')}<h3>Navigation</h3>${links.map(([p,s])=>a(p,s)).join('')}</div></div>`;document.querySelector('[data-action="closedrawer"]').focus()}
function closeDrawer(){document.getElementById('drawer').innerHTML='';if(lastFocus&&lastFocus.isConnected)lastFocus.focus()}
document.addEventListener('click',e=>{let t=e.target.closest('[data-action]');if(t){let v=t.dataset.action;if(v==='menu')drawer();if(v==='closedrawer')closeDrawer();if(v==='all'){filter=false;render()}if(v==='filter'){filter=true;render()}if(v==='save')feedback('editor-status','SIMULATION: Draft marked saved on this screen. Nothing was persisted.');if(v==='publish'){if(current()==='/admin/projects/new'&&(!document.getElementById('ptitle').value.trim()||!document.getElementById('slug').value.trim()))feedback('editor-status','Enter a title and slug before publishing (design validation only).',true);else modal()}if(v==='cancel')closeModal();if(v==='confirm'){closeModal();showToast('SIMULATION: Publish confirmation demonstrated. Nothing is public.')}if(v==='empty')document.getElementById('rows').innerHTML='<div class="empty"><h3>No projects yet</h3><p>This is a simulated empty collection.</p><a href="#/admin/editor" class="btn primary">Create project</a></div>';if(v==='reject')feedback('upload-status','SIMULATION: Rejected file. Review allowed file type/size and try again.',true);if(v==='settings')showToast('SIMULATION: Settings not saved.')}if(e.target.matches('[data-overlay]'))closeModal();if(e.target.matches('[data-drawer]'))closeDrawer()});
document.addEventListener('submit',e=>{if(['contact-form','login-form','otp-form','edit-form'].includes(e.target.id))e.preventDefault();if(e.target.id==='contact-form'){if(e.target.reportValidity())feedback('contact-status','SIMULATION: Your example message was not sent or saved.');else feedback('contact-status','Please correct the required fields.',true)}if(e.target.id==='login-form'&&e.target.reportValidity())location.hash='#/admin/verify';if(e.target.id==='otp-form'&&e.target.reportValidity())location.hash='#/admin'});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.getElementById('modal').innerHTML)closeModal();if(document.getElementById('drawer').innerHTML)closeDrawer()}});window.addEventListener('hashchange',render);render();
</script></body></html>
