name: Portfolio CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://studio_ci:studio_ci_ephemeral@127.0.0.1:5432/studio_ci
      PORTFOLIO_PUBLIC_ORIGIN: http://127.0.0.1:3000
      PORTFOLIO_AUTH_SECRET: ci-only-not-for-deployment-64-character-auth-key-2026-example
      HOST: 127.0.0.1
      PORT: "3000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-fund
      - name: Lint, test and build
        run: npm run check
      - name: Install native PostgreSQL 16
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-16 postgresql-client-16
          sudo pg_ctlcluster 16 main start || sudo pg_ctlcluster 16 main status
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE studio_ci LOGIN PASSWORD 'studio_ci_ephemeral';"
          sudo -u postgres createdb --owner=studio_ci studio_ci
      - name: Start production SSR on loopback
        shell: bash
        run: |
          NODE_ENV=production node server.js >/tmp/portfolio-studio-server.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          tail -80 /tmp/portfolio-studio-server.log
          exit 1
      - name: Public and anonymous security smoke
        run: node scripts/smoke.mjs
      - name: Password, OTP, dashboard and logout integration
        run: node scripts/studio-auth-smoke.mjs
      - name: Dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high
      - name: Diagnostics on failure
        if: failure()
        run: |
          test ! -f /tmp/portfolio-studio-server.log || tail -80 /tmp/portfolio-studio-server.log
