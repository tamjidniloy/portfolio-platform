name: Phase 04 Native PostgreSQL CI
on:
  push:
    branches: [feat/phase04-windows-native-development, feat/phase04-1-database-candidate, feat/phase04-2-identity-security-foundation]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://devfolio_ci:ci_ephemeral_only@127.0.0.1:5432/devfolio_ci
      HOST: 127.0.0.1
      PORT: "3000"
      CANDIDATE_DATABASE_URL: postgresql://devfolio_ci:ci_ephemeral_only@127.0.0.1:5432/devfolio_candidate_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
      - name: Native PostgreSQL 16 (no containers)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-client-16
          sudo pg_ctlcluster 16 main status || sudo pg_ctlcluster 16 main start
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE devfolio_ci LOGIN PASSWORD 'ci_ephemeral_only';"
          sudo -u postgres createdb --owner=devfolio_ci devfolio_ci
          sudo -u postgres createdb --owner=devfolio_ci devfolio_candidate_ci
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "SELECT 1" | grep -qx 1
      - name: Install exact dependency graph
        run: |
          npm ci --no-fund
      - name: Syntax, lint, no-container checks
        run: npm run check:syntax && npm run lint && npm run check:no-docker
      - name: Unit tests
        run: npm test
      - name: Database integration and environment doctor
        run: npm run verify:db && npm run doctor
      - name: Isolated candidate schema and transactions (not production migrations)
        run: npm run db:test:candidate
      - name: Candidate identity/session integration (no live login)
        run: npm run auth:test:candidate
      - name: Heuristic secret scan
        run: npm run check:secrets
      - name: Production SSR build
        run: npm run build
      - name: Start SSR server
        run: NODE_ENV=production node server.js >/tmp/devfolio-ssr.log 2>&1 &
      - name: HTTP and native DB smoke checks
        shell: bash
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz >/dev/null; then break; fi
            sleep 1
          done
          node scripts/smoke.mjs
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Troubleshooting on failure
        if: failure()
        run: test ! -f /tmp/devfolio-ssr.log || tail -100 /tmp/devfolio-ssr.log
