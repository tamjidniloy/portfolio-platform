name: Sync Release1 dependency lock
on:
  push:
    branches: [feat/phase04-release1-unblock]
    paths: [package.json]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Resolve exact pinned dependency tree
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit updated package lock to feature branch
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'build: synchronize pinned WebAuthn lockfile'
            git push origin HEAD:feat/phase04-release1-unblock
          fi
