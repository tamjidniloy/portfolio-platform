# One-time feature-branch lockfile creation. Remove after lock is committed.
name: Phase 04.0 Lockfile Bootstrap

on:
  push:
    branches:
      - feat/phase04-0-foundation

permissions:
  contents: write

jobs:
  lockfile:
    if: "!contains(github.event.head_commit.message, 'chore(deps): generate package-lock')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase04-0-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate npm lock without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lock to feature branch only
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already matches manifest."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(deps): generate package-lock for Phase 04.0"
          git push origin HEAD:feat/phase04-0-foundation
