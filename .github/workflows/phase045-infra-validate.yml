name: Phase 04.5 IaC validation (no cloud credentials)
on:
  pull_request:
  push:
    branches: [feat/phase04-5-deployment-observability, main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
      - name: Terraform parse and validate (never apply)
        working-directory: infra/aws
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate -no-color
      - name: Shell syntax (no external resource calls)
        run: |
          bash -n ops/aws/deploy-host.sh
          bash -n ops/aws/restore-drill.sh
          bash -n ops/aws/health-smoke.sh
          bash -n infra/aws/user-data.sh.tftpl
      - name: Redacted telemetry tests
        run: |
          node --test tests/observability.test.js
