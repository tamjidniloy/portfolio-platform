name: Phase 04.5 AWS release (manual, protected environment)
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Approved AWS environment; GitHub environment protection is mandatory
        type: choice
        required: true
        options: [staging, production]
permissions:
  contents: read
concurrency:
  group: devfolio-deploy-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TARGET_ENV: ${{ inputs.environment }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_RELEASE_BUCKET: ${{ vars.AWS_RELEASE_BUCKET }}
      AWS_ASG_NAME: ${{ vars.AWS_ASG_NAME }}
      AWS_RELEASE_PARAMETER: ${{ vars.AWS_RELEASE_PARAMETER }}
      AWS_RELEASE_SIGNING_KEY_ARN: ${{ vars.AWS_RELEASE_SIGNING_KEY_ARN }}
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
      - name: Refuse missing reviewed release configuration
        shell: bash
        env:
          AWS_OIDC_ROLE_ARN: ${{ vars.AWS_OIDC_ROLE_ARN }}
        run: |
          set -euo pipefail
          for name in AWS_REGION AWS_RELEASE_BUCKET AWS_ASG_NAME AWS_RELEASE_PARAMETER AWS_RELEASE_SIGNING_KEY_ARN SITE_ORIGIN AWS_OIDC_ROLE_ARN; do
            test -n "${!name}" || { echo "::error::Required GitHub Environment variable $name not configured"; exit 2; }
          done
          [[ "$SITE_ORIGIN" =~ ^https://[a-zA-Z0-9.-]+$ ]] || exit 2
      - name: Verify exact source and build with no container
        run: |
          npm ci --no-fund
          npm run check
          npm run build
          npm sbom --sbom-format cyclonedx > release-sbom.json
          npm prune --omit=dev --no-fund
          tar -czf release.tgz build server domain app scripts db ops node_modules package.json package-lock.json server.js
          sha256sum release.tgz | tee release.sha256
          sha256sum release-sbom.json > release-sbom.sha256
          node -e 'process.stdout.write(JSON.stringify({commit:process.env.GITHUB_SHA,workflow:process.env.GITHUB_WORKFLOW,run_id:process.env.GITHUB_RUN_ID,created_at:new Date().toISOString()}))' > release-manifest.json
      - name: Emit trusted GitHub provenance attestation for the exact archive
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release.tgz
      - name: Verify GitHub-generated attestation before any AWS upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify release.tgz --repo "$GITHUB_REPOSITORY"
      - name: Configure short-lived AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          role-session-name: devfolio-release
      - name: Sign immutable SHA-256 digest using environment-scoped AWS KMS
        shell: bash
        run: |
          set -euo pipefail
          sha="$(sha256sum release.tgz | cut -d' ' -f1)"
          printf "%s" "$sha" | xxd -r -p > release.digest
          aws kms sign --key-id "$AWS_RELEASE_SIGNING_KEY_ARN" \
            --message-type DIGEST --signing-algorithm RSASSA_PSS_SHA_256 \
            --message fileb://release.digest --query Signature --output text | base64 --decode > release.sig
          test -s release.sig
          valid="$(aws kms verify --key-id "$AWS_RELEASE_SIGNING_KEY_ARN" \
            --message-type DIGEST --signing-algorithm RSASSA_PSS_SHA_256 \
            --message fileb://release.digest --signature fileb://release.sig --query SignatureValid --output text)"
          test "$valid" = True
      - name: Upload signed immutable release and deploy with serial host verification
        shell: bash
        run: |
          set -euo pipefail
          sha="$(sha256sum release.tgz | cut -d' ' -f1)"
          key="releases/$TARGET_ENV/$sha.tgz"
          aws s3api put-object --bucket "$AWS_RELEASE_BUCKET" --key "$key" \
            --body release.tgz --server-side-encryption AES256 --if-none-match '*' >/dev/null
          for artifact in release.sig release-sbom.json release-manifest.json; do
            case "$artifact" in
              release.sig) extension=sig ;;
              release-sbom.json) extension=sbom.json ;;
              release-manifest.json) extension=manifest.json ;;
            esac
            aws s3api put-object --bucket "$AWS_RELEASE_BUCKET" \
              --key "releases/$TARGET_ENV/$sha.$extension" --body "$artifact" \
              --server-side-encryption AES256 --if-none-match '*' >/dev/null
          done
          instances="$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$AWS_ASG_NAME" --output json |
            jq -r '.AutoScalingGroups[0].Instances[]? | select(.LifecycleState=="InService") | .InstanceId')"
          count="$(printf "%s\n" "$instances" | grep -Ec '^i-[a-z0-9]+$' || true)"
          minimum=1
          if [[ "$TARGET_ENV" == production ]]; then minimum=2; fi
          if (( count < minimum )); then
            echo "::error::Auto Scaling capacity below required count"; exit 4
          fi
          previous_sha="$(aws ssm get-parameter --name "$AWS_RELEASE_PARAMETER" --query Parameter.Value --output text)"
          updated_instances=()
          deploy_instance() {
            local instance="$1"
            local target_sha="$2"
            local key="releases/$TARGET_ENV/$target_sha.tgz"
            local command params id
            command="set -euo pipefail; tmp=\$(mktemp -d); aws s3 cp s3://$AWS_RELEASE_BUCKET/$key \$tmp/release.tgz --only-show-errors; echo '$target_sha  '\$tmp'/release.tgz' | sha256sum --check --status; aws s3 cp s3://$AWS_RELEASE_BUCKET/releases/$TARGET_ENV/$target_sha.sig \$tmp/release.sig --only-show-errors; python3 -c 'import sys;sys.stdout.buffer.write(bytes.fromhex(sys.argv[1]))' '$target_sha' > \$tmp/release.digest; verified=\$(aws kms verify --key-id $AWS_RELEASE_SIGNING_KEY_ARN --message-type DIGEST --signing-algorithm RSASSA_PSS_SHA_256 --message fileb://\$tmp/release.digest --signature fileb://\$tmp/release.sig --query SignatureValid --output text); test \"\$verified\" = True; tar -xOzf \$tmp/release.tgz ops/aws/deploy-host.sh > \$tmp/deploy-host.sh; bash \$tmp/deploy-host.sh $target_sha $AWS_RELEASE_BUCKET $TARGET_ENV; rm -rf \$tmp"
            params="$(jq -n --arg command "$command" '{commands: [$command]}')"
            id="$(aws ssm send-command --document-name AWS-RunShellScript \
              --instance-ids "$instance" --parameters "$params" \
              --comment "DEVFOLIO KMS-verified release" --query 'Command.CommandId' --output text)"
            aws ssm wait command-executed --command-id "$id" --instance-id "$instance"
            test "$(aws ssm get-command-invocation --command-id "$id" \
              --instance-id "$instance" --query Status --output text)" = Success
          }
          rollback_fleet_on_failure() {
            local original_status="$?"
            trap - ERR
            if [[ "$previous_sha" =~ ^[0-9a-f]{64}$ && "$previous_sha" != "$sha" ]]; then
              echo "::warning::Rolling previously updated instances back to verified prior release"
              for old_instance in "${updated_instances[@]}"; do
                deploy_instance "$old_instance" "$previous_sha" || echo "::error::Operator intervention required on $old_instance"
              done
            else
              echo "::error::Initial deployment has no prior release for automatic fleet rollback"
            fi
            exit "$original_status"
          }
          trap rollback_fleet_on_failure ERR
          for instance in $instances; do
            [[ "$instance" =~ ^i-[0-9a-f]{8,17}$ ]] || exit 4
            deploy_instance "$instance" "$sha"
            updated_instances+=("$instance")
          done
          bash ops/aws/health-smoke.sh "$SITE_ORIGIN"
          # Only publish bootstrap pointer after EVERY existing host passes.
          aws ssm put-parameter --name "$AWS_RELEASE_PARAMETER" \
            --value "$sha" --type String --overwrite >/dev/null
          trap - ERR
          echo "Verified SHA-256, KMS signature, attested source and deployment to $count hosts."
