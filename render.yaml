# DEVFOLIO OS — single-instance managed Node + PostgreSQL + persistent uploads.
# Plans are paid; inspect Render's current pricing BEFORE creating the Blueprint.
# The disk prevents zero-downtime deploys and horizontal web scaling.
services:
  - type: web
    name: devfolio-os
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    branch: main
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /readyz
    disk:
      name: portfolio-uploads
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: NODE_VERSION
        value: 22.12.0
      - key: PORTFOLIO_UPLOAD_DIR
        value: /var/data/uploads
      - key: DATABASE_URL
        fromDatabase:
          name: devfolio-postgres
          property: connectionString
      - key: PORTFOLIO_AUTH_SECRET
        generateValue: true
      - key: PORTFOLIO_PUBLIC_ORIGIN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: PORTFOLIO_FROM_EMAIL
        sync: false
databases:
  - name: devfolio-postgres
    plan: 0.1c-256mb
    region: singapore
    databaseName: devfolio_prod
    user: devfolio_owner
