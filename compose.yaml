# Local development/test PostgreSQL only; not a production deployment.
services:
  postgres:
    image: postgres:16.10
    restart: unless-stopped
    environment:
      POSTGRES_USER: devfolio
      POSTGRES_PASSWORD: devfolio_local_only
      POSTGRES_DB: devfolio
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devfolio -d devfolio"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - devfolio_pgdata:/var/lib/postgresql/data

volumes:
  devfolio_pgdata:
