status: CANDIDATE_NOT_APPROVED_NOT_DEPLOYED
version: 03.5-proposal-2026-10-23
authentication:
  owner_registration: disabled
  password_hash:
    algorithm: argon2id
    minimum_memory_kib: 19456
    min_iterations: 2
    parallelism: 1
    benchmark_before_prod: true
  legacy_email_otp_is_nist_aal2: false
  decision_required: choose WebAuthn/passkey or TOTP alternative, or document legacy
    email risk without AAL2 claim
  challenge_seconds_candidate: 300
  max_challenge_attempts_candidate: 5
  resend_cooldown_seconds_candidate: 60
session:
  cookie_name_candidate: __Host-devfolio_session
  secure: true
  http_only: true
  same_site_candidate: Lax
  domain_attribute: null
  path: /
  server_side_revocation: true
  store_raw_session_token: false
  idle_minutes_candidate: 30
  absolute_hours_candidate: 12
  allow_localstorage_tokens: false
csrf:
  unsafe_methods:
  - POST
  - PUT
  - PATCH
  - DELETE
  synchronizer_token: true
  check_origin: true
  check_fetch_metadata: true
  samesite_is_only_defense: false
  allow_credentialed_wildcard_cors: false
cache:
  admin: private, no-store
  preview: private, no-store
  auth: private, no-store
  public_unpublish_sensitive: no-store until invalidation is proven
headers_candidate:
  x-content-type-options: nosniff
  referrer-policy: strict-origin-when-cross-origin
  content-security-policy: default-src 'self'; object-src 'none'; base-uri 'self';
    frame-ancestors 'none'; form-action 'self'; script-src 'self' 'nonce-{PER_RESPONSE_RANDOM}'
  strict-transport-security: max-age=31536000 (only after HTTPS validation; preload
    needs separate review)
authorization:
  default: deny
  owner_actor_from: server_verified_session
  public_query_source: published_snapshots projection only
  private_preview_requires_owner: true
  field_level_public_dto_allowlist: true
privacy:
  contact_retention_days: null
  audit_retention_days: null
  backup_retention_days: null
  analytics: disabled until owner privacy decision
qa:
  runtime_tests_passed: false
  owasp_asvs_certified: false
  owner_approved: false
